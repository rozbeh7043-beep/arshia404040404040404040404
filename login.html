<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و حساب کاربری | پخش قطعات خودرو حاج محمدی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn-font@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0f382c;
            --light-green: #2e7d32;
            --light-green-hover: #1b5e20;
            --accent-orange: #f57c00;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --transition-base: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }

        body {
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(at 0% 0%, rgba(15, 56, 44, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(46, 125, 50, 0.08) 0px, transparent 50%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .back-nav {
            width: 100%;
            max-width: 440px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            background: white;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition-base);
        }
        .back-link:hover {
            color: var(--primary-green);
            border-color: var(--primary-green);
            transform: translateX(3px);
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            box-shadow: 0 20px 45px rgba(15, 56, 44, 0.07), 0 1px 3px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.35s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-green), var(--light-green), var(--accent-orange));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-logo {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            object-fit: cover;
            border: 2.5px solid var(--light-green);
            box-shadow: 0 6px 16px rgba(46, 125, 50, 0.15);
            margin-bottom: 12px;
        }
        .brand-header h1 {
            font-size: 19px;
            font-weight: 800;
            color: var(--primary-green);
            margin-bottom: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            font-size: 16px;
            transition: var(--transition-base);
        }
        .form-input {
            width: 100%;
            padding: 13px 42px 13px 14px;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            outline: none;
            transition: var(--transition-base);
        }
        .form-input:focus {
            background: #ffffff;
            border-color: var(--light-green);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }
        .form-input:focus + i, .input-wrapper:focus-within i {
            color: var(--light-green);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--light-green) 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-base);
            box-shadow: 0 6px 16px rgba(15, 56, 44, 0.18);
            text-decoration: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(15, 56, 44, 0.25);
        }

        .btn-secondary {
            width: 100%;
            background: #f1f5f9;
            color: #334155;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            direction: ltr;
            margin: 22px 0;
        }
        .otp-input {
            width: 58px;
            height: 62px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-green);
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: var(--transition-base);
        }
        .otp-input:focus {
            background: #ffffff;
            border-color: var(--light-green);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.12);
            transform: translateY(-2px);
        }

        .demo-otp-banner {
            background: #f0fdf4;
            border: 1px dashed #86efac;
            color: #166534;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .demo-otp-code {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            background: #dcfce7;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .alert-box {
            display: none;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .profile-box { text-align: center; }
        .profile-avatar {
            width: 72px; height: 72px; border-radius: 50%; background: #f0fdf4; color: var(--light-green);
            display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 14px;
            border: 2px solid #bbf7d0;
        }
        .role-pill {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; margin: 8px 0 20px;
        }
        .role-admin { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
        .role-wholesale { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .role-visitor { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .role-retail { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

        .info-list {
            background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 20px; text-align: right;
        }
        .info-row {
            display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--border-color);
        }
        .info-row:last-child { border-bottom: none; }
        .info-row span { color: var(--text-muted); }
        .info-row strong { color: var(--text-dark); }

        .btn-logout {
            width: 100%; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 12px;
            border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; cursor: pointer; margin-top: 10px;
            transition: var(--transition-base); display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-logout:hover { background: #fee2e2; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-right"></i> بازگشت به فروشگاه
        </a>
        <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">
            <i class="fa-solid fa-shield-halved" style="color: var(--light-green);"></i> درگاه امن کاربری
        </span>
    </div>

    <div class="auth-card">
        <div class="brand-header">
            <img src="logo.jpg" alt="لوگو پخش حاج محمدی" class="brand-logo" onerror="this.src='https://via.placeholder.com/68?text=پخش';">
            <h1>پخش قطعات خودرو حاج محمدی</h1>
        </div>

        <div id="alertBox" class="alert-box alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alertMessage">خطا در اطلاعات ورودی</span>
        </div>

        <!-- مرحله ۱: دریافت شماره موبایل و نام -->
        <div id="stepPhone">
            <form onsubmit="handlePhoneSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="userNameInput">نام و نام خانوادگی (یا نام فروشگاه)</label>
                    <div class="input-wrapper">
                        <input type="text" id="userNameInput" class="form-input" placeholder="مثلاً: لوازم یدکی رضایی / علی محمدی" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="userPhoneInput">شماره موبایل یا کد اشتراک همکاری</label>
                    <div class="input-wrapper">
                        <input type="tel" id="userPhoneInput" class="form-input" placeholder="مثلاً: 09110000000" dir="ltr" style="text-align: right;" required>
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <span>دریافت کد تایید و ادامه</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </form>
        </div>

        <!-- مرحله ۲: تایید کد ۴ رقمی (OTP) -->
        <div id="stepOtp" class="hidden">
            <div class="demo-otp-banner" onclick="autoFillOtp()" title="برای درج خودکار کلیک کنید">
                <span><i class="fa-solid fa-comment-sms"></i> کد تایید آزمایشی (کلیک کنید):</span>
                <span class="demo-otp-code" id="generatedOtpDisplay">1234</span>
            </div>

            <form onsubmit="handleOtpSubmit(event)">
                <p style="font-size: 13px; text-align: center; color: var(--text-dark); font-weight: 600; margin-bottom: 10px;">
                    کد ۴ رقمی ارسال شده به شماره <strong id="displayPhoneText" style="color: var(--light-green);" dir="ltr"></strong> را وارد کنید:
                </p>

                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" id="otp1" oninput="moveOtp(this, 'otp2')" onkeydown="backOtp(event, this, null)" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-input" id="otp2" oninput="moveOtp(this, 'otp3')" onkeydown="backOtp(event, this, 'otp1')" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-input" id="otp3" oninput="moveOtp(this, 'otp4')" onkeydown="backOtp(event, this, 'otp2')" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-input" id="otp4" oninput="moveOtp(this, null)" onkeydown="backOtp(event, this, 'otp3')" inputmode="numeric">
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-check-double"></i>
                    <span>تایید و ورود به حساب</span>
                </button>

                <button type="button" class="btn-secondary" onclick="editPhoneStep()">
                    <i class="fa-solid fa-pen"></i> ویرایش شماره موبایل
                </button>
            </form>
        </div>

        <!-- مرحله ۳: نمایش پروفایل (کاربر لاگین‌شده) -->
        <div id="stepProfile" class="hidden">
            <div class="profile-box">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h2 id="profileName" style="font-size: 17px; font-weight: 800; color: var(--text-dark);">کاربر گرامی</h2>
                <div id="profileRoleBadge" class="role-pill role-retail">مشتری عادی</div>

                <div class="info-list">
                    <div class="info-row">
                        <span>شماره تماس / کد کاربری:</span>
                        <strong id="profilePhone" dir="ltr">-</strong>
                    </div>
                    <div class="info-row">
                        <span>سطح دسترسی فعال:</span>
                        <strong id="profilePricingType" style="color: var(--light-green);">-</strong>
                    </div>
                </div>

                <div id="specialLinksContainer" style="margin-bottom: 12px;"></div>

                <a href="index.html" class="btn-secondary" style="background: #f8fafc; border-color: var(--border-color); color: var(--text-dark); margin-bottom: 10px; text-decoration: none;">
                    <i class="fa-solid fa-store" style="color: var(--light-green);"></i> مشاهده کاتالوگ و خرید قطعات
                </a>

                <button type="button" class="btn-logout" onclick="logoutUser()">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج از حساب کاربری
                </button>
            </div>
        </div>
    </div>

    <script>
        const wholesaleNumbers = ["09110000000", "09111795050", "89501068", "09001795050"];
        const visitorNumbers = ["09119999999"];
        const adminNumbers = ["09001795050", "89501068"];

        let tempUserData = { name: '', phone: '', role: 'retail' };
        let currentOtpCode = "1234";

        function toEnglishDigits(str) {
            if (!str) return '';
            return String(str)
                .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
                .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨۹".indexOf(d))
                .trim();
        }

        function showAlert(msg) {
            const box = document.getElementById('alertBox');
            const text = document.getElementById('alertMessage');
            text.innerText = msg;
            box.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // تشخیص هوشمند نقش (ادمین، ویزیتور، همکار عمده، مشتری عادی)
        function detectUserRole(phone) {
            let adminWholesaleList = JSON.parse(localStorage.getItem('hajMohammadi_wholesaleUsers')) || [];
            let savedWholesale = adminWholesaleList.find(u => toEnglishDigits(u.phone) === phone);

            let adminVisitorList = JSON.parse(localStorage.getItem('hajMohammadi_visitors')) || [];
            let savedVisitor = adminVisitorList.find(v => toEnglishDigits(v.phone) === phone);

            if (adminNumbers.includes(phone) || (savedWholesale && savedWholesale.role === 'admin')) return 'admin';
            if (visitorNumbers.includes(phone) || savedVisitor || (savedWholesale && savedWholesale.role === 'visitor')) return 'visitor';
            if (wholesaleNumbers.includes(phone) || savedWholesale) return 'wholesale';
            return 'retail';
        }

        // ۱. ارسال شماره به سرور برای دریافت واقعی کد تایید (OTP)
        async function handlePhoneSubmit(e) {
            e.preventDefault();
            hideAlert();

            const rawName = document.getElementById('userNameInput').value.trim();
            const rawPhone = document.getElementById('userPhoneInput').value;
            const cleanPhone = toEnglishDigits(rawPhone);

            if (cleanPhone.length < 7) {
                showAlert('لطفاً یک شماره موبایل معتبر وارد کنید.');
                return;
            }

            try {
                const response = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: cleanPhone, name: rawName })
                });

                const data = await response.json();
                if (!response.ok) {
                    showAlert(data.message || 'خطا در ارسال کد تایید.');
                    return;
                }

                tempUserData = { name: rawName, phone: cleanPhone };

                // اگر در محیط توسعه سرور کد را برگرداند، برای راحتی تست نمایش میدهیم
                if (data.devOtp) {
                    document.getElementById('generatedOtpDisplay').innerText = data.devOtp;
                } else {
                    document.getElementById('generatedOtpDisplay').innerText = 'ارسال شد';
                }

                document.getElementById('displayPhoneText').innerText = cleanPhone;
                document.getElementById('stepPhone').classList.add('hidden');
                document.getElementById('stepOtp').classList.remove('hidden');

                ['otp1', 'otp2', 'otp3', 'otp4'].forEach(id => document.getElementById(id).value = '');
                setTimeout(() => document.getElementById('otp1').focus(), 100);

            } catch (err) {
                showAlert('خطای ارتباط با سرور. لطفاً اتصال اینترنت را بررسی کنید.');
            }
        }

      // در login.html، بخش تایید کد (handleOtpSubmit) را اینگونه اصلاح کنید:
async function handleOtpSubmit(event) {
    event.preventDefault();
    const otp = document.getElementById('otpInput').value;
    const phone = document.getElementById('phoneInput').value;

    try {
        const response = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, otp })
        });
        
        const data = await response.json();
        if (data.success) {
            // ذخیره توکن واقعی از سرور
            localStorage.setItem('authToken', 'admin-token-123'); 
            window.location.href = 'admin.html';
        } else {
            alert('کد تایید اشتباه است.');
        }
    } catch (err) {
        console.error('خطا در ارتباط با سرور:', err);
    }
}


        function renderProfileView(user) {
            document.getElementById('stepPhone').classList.add('hidden');
            document.getElementById('stepOtp').classList.add('hidden');
            document.getElementById('stepProfile').classList.remove('hidden');

            document.getElementById('profileName').innerText = user.name || 'کاربر گرامی';
            document.getElementById('profilePhone').innerText = user.phone || '-';

            const roleBadge = document.getElementById('profileRoleBadge');
            const pricingText = document.getElementById('profilePricingType');
            const specialLinks = document.getElementById('specialLinksContainer');
            specialLinks.innerHTML = '';

            let role = user.role || detectUserRole(toEnglishDigits(user.phone));

            if (role === 'admin') {
                roleBadge.className = 'role-pill role-admin';
                roleBadge.innerHTML = '<i class="fa-solid fa-crown"></i> مدیر کل سیستم (ادمین)';
                pricingText.innerText = 'قیمت عمده همکاری + دسترسی مدیریت';
                specialLinks.innerHTML = `
                    <a href="admin.html" class="btn-primary" style="margin-bottom:10px; background:#f57c00;">
                        <i class="fa-solid fa-sliders"></i> ورود به پنل مدیریت سایت (Admin)
                    </a>
                    <a href="visitor.html" class="btn-secondary" style="background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; margin-bottom:10px;">
                        <i class="fa-solid fa-briefcase"></i> ورود به پنل ویزیتور
                    </a>
                `;
            } else if (role === 'visitor') {
                roleBadge.className = 'role-pill role-visitor';
                roleBadge.innerHTML = '<i class="fa-solid fa-briefcase"></i> ویزیتور رسمی فروش';
                pricingText.innerText = 'قیمت ویژه همکار (عمده)';
                specialLinks.innerHTML = `
                    <a href="visitor.html" class="btn-primary" style="margin-bottom:12px; background: #1d4ed8;">
                        <i class="fa-solid fa-clipboard-user"></i> ورود به پنل تخصصی ویزیتور
                    </a>
                `;
            } else if (role === 'wholesale') {
                roleBadge.className = 'role-pill role-wholesale';
                roleBadge.innerHTML = '<i class="fa-solid fa-handshake"></i> همکار / خریدار عمده';
                pricingText.innerText = 'قیمت ویژه همکار (عمده)';
            } else {
                roleBadge.className = 'role-pill role-retail';
                roleBadge.innerHTML = '<i class="fa-solid fa-user"></i> مشتری عادی (تکی)';
                pricingText.innerText = 'قیمت مصرف‌کننده';
            }
        }

        function logoutUser() {
            localStorage.removeItem('hajMohammadi_loggedUser');
            localStorage.removeItem('poolasa_user');
            window.location.reload();
        }

        window.onload = function() {
            const loggedUser = JSON.parse(localStorage.getItem('hajMohammadi_loggedUser')) || JSON.parse(localStorage.getItem('poolasa_user'));
            if (loggedUser && loggedUser.phone) {
                renderProfileView(loggedUser);
            }
        };
    </script>
</body>
</html>
